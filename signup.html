<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Flow</title>
    <!-- <link rel="stylesheet" href="/style/main.css"> -->
     <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/auth.css">
</head>
<body>
<header class="header">
    <img src="media\images\flow_logo.png" alt="Flow Logo" width="200">
    <nav class="nav">
        <a href="login.html">Go back to login page</a>
    </nav>
</header>


<main>
    <section class="signup">
    <div class="signup-div">
        <h3>Join Flow Community</h3>
        <legend>Personal Information</legend>
        <form id="signup-form" action="" method="POST">
            <label for="first-name">First Name:</label>
            <input id="first-name" type="text" name="first name" required placeholder="first name"><br>
            <label  for="last name">Last Name:</label>
            <input id="last-name" type="text"  name="last name" required placeholder="last name">
            <label  for="username">Username:</label>
            <input id="user-name" type="text" name="username" required placeholder="username" minlength="5" maxlength="30">
            <label  for="email">Email:</label>
            <input id="email" type="email" name="email" required placeholder="email">
            <label  for="password">Password:</label>
            <input id="pass" type="password" name="password" required placeholder="password" minlength="10" maxlength="20">
            <input id="submit-btn" type="submit" value="Start your Flow journey">
            <input id="clear-btn" type="reset" value="Clear Form"> 
        </form>  
         
     </div>
    </section>
    </main>

<footer class="footer">
    <p>&copy; 2026 Flow. All rights reserved.</p>
    <p>Thanks for using our website..!</p>
</footer>
<script src="js/auth.js"></script>
</body>

</html>
