<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style/main.css">
</head>

<!-- here, we have to add id to use them later in JS -->

<body>
    <header class="header">
        <img class="logo" src="../../media/images/flow_logo.png" alt="Flow Logo">
    </header>

    <div class="header">
        <h1>Here is your profile</h1>
    </div>
    <div id="profile-mod">
        <h2 id="profile-username"></h2>
        <p id="profile-bio"></p>
        <p>Followers: <span id="followers-count"></span></p>
        <p>Following: <span id="following-count"></span></p>

        <button id="edit-btn"  style="display:none;">Edit</button>
        <button id="follow-btn" style="display:none;">Follow</button> 
    </div>
    <section id="create-a-post">
        <h3>Create a post</h3>
        <form id="create-post-form">
            <textarea id="post-text" placeholder="type your post here"></textarea>
            <button id="submit-btn" type="submit" name="create a post">Submit</button>
            <button id="clear-btn" type="clear" name="clear a post">Clear</button>
        </form>
        <div id="profile-feed">

        </div>

    </section>
    <footer class="footer">
        <p>&copy; 2026 Flow. All rights reserved.</p>
        <p>Thanks for using our website..!</p>
    </footer>
</body>

<script src="js/profile.js"></script>

</html>
