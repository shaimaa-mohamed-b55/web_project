<!DOCTYPE html>
<html lang="en">

<head>
    <title>Flow Feed</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/main.css">
    <script src="js\feed.js" defer></script>
    <style type="text/css">

        #submit-btn, #clear-btn ,#like-btn ,#comment-btn {
            background-color: var(--color-button);
            color:var(--primary-color);
            border-color: none;
            border-radius: 5px;
        }
        
    </style>
</head>

<body>
    
    <header class="header">
        <img class="logo" src="../../media/images/flow_logo.png" alt="Flow Logo">
    </header>
    
    <main>
        
    <div class="posts-background">

        <form id="create-post-form">
            <textarea id="post" placeholder="write your ideas here.."></textarea>
            <input type="button" value="submit" id="submit-btn">
            <input type="button" value="clear" id="clear-btn" >
        </form>

        <div id="feed" class="post">
        </div>

        <div class="user-action">

            <div class="like">
                <button id="like-btn">
                    <img id="star-icon" src="media/icons/no-color-star.png" alt="Like Icon" width="20">
                </button>
                <label id="counter">0</label>
            </div>
            
            <div class="comment">
                <textarea placeholder="Comment here"></textarea>
                <button id="comment-btn">
                    <img src="media/icons/send.png" alt="send" width="20">
                </button>
            </div>
            
                
            
        </div>    
    </div>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Flow. All rights reserved.</p>
        <p>Thanks for using our website..!</p>
    </footer>

</body>


</html>
