<!DOCTYPE html>
<html lang="en">

<head>
    <title>Flow Feed</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/main.css">
    <!-- <script src="js\feed.js" defer></script> -->
    <style type="text/css">
       
    </style>
</head>

<body>

    <header class="header">
        <img class="logo" src="media/images/flow_logo.png" alt="Flow Logo">
    </header>


    <main>

        <input type="button" value="Profile" id="profile-btn">
        <div class="posts-background">

            <form id="feed-create-post-form">
                <textarea id="feed-post-input" placeholder="write your ideas here.."></textarea>
                <input type="button" value="submit" id="feed-submit-btn">
                <!-- <input type="button" value="clear" id="clear-btn"> -->
            </form>
            <div id="feed-posts" class="post">
            </div>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Flow. All rights reserved.</p>
        <p>Thanks for using our website..!</p>
    </footer>

</body>
<script src="js/feed.js"></script>
</html>
