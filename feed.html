<!DOCTYPE html>
<html lang="en">

<head>
    <title>Flow Feed</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/main.css">
    <script src="js\feed.js" defer></script>
    <style type="text/css">
       
    </style>
</head>

<body>

    <header class="header">
        <img class="logo" src="media/images/flow_logo.png" alt="Flow Logo">
    </header>


    <main>
        <a href="profile.html">Your profile</a>
        <div class="posts-background">

            <form id="create-post-form">
                <textarea id="post" placeholder="write your ideas here.."></textarea>
                <input type="button" value="submit" id="submit-btn">
                <input type="button" value="clear" id="clear-btn">
            </form>

            <div id="profile-feed" class="post">
            </div>



            <div class="user-action">
                <div class="like-container" id="like-container">
                    <img id="star-icon" src="media/icons/no-color-star.png" alt="Like Icon" width="20">
                    <span id="counter">0</span>
                </div>

                <div class="comment">
                    <textarea id="comments-area" placeholder="Comment here" ></textarea>
                    <div class="send-container" id="send-container">
                        <img id ="sendIcon" src="media/icons/send.png" alt="send" width="20">
                    </div>
                </div>
            </div>

            <div class="comments-section" id="comments-section">
                <p>Comments</p>
                <div id="comments-list"></div>
            </div>
        </div>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Flow. All rights reserved.</p>
        <p>Thanks for using our website..!</p>
    </footer>

</body>
<script src="js/feed.js"></script>
</html>
