<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register To Flow</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
<!-- ==========================
           HEADER 
=========================== -->
<header>
    <h1>Start your flow journey</h1>
    <img src="\C:\Users\student\Desktop\CMPS350\web_project\media\images\flow_logo.png" alt="Flow Logo" >
</header>

<!-- ==========================
           NAVIGATION 
=========================== -->
<nav>
<a href="index.html">Back to Login page</a>
</nav>

<!-- ==========================
             MAIN 
=========================== -->
<main>
    <section class="register">
    <h3>Join Flow Community</h3>
    <div></div>
    <fieldset>
        <legend>User Information</legend>
        <form action="#" method="POST">
        <label for="first name">First Name:</label>
        <input type="text" id="first name" name="first name" required placeholder="first name">
        <label for="last name">Last Name:</label>
        <input type="text" id="last name" name="last name" required placeholder="last name">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required placeholder="username" minlength="5" maxlength="30">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="email">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="password" minlength="10" maxlength="20" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{10,20}" title="password must contain upper case, lower case, number and special character"> 
    </fieldset>
    <input  class="submit" type="submit" value="Register"> 
     <input class="reset" type="reset" value="Clear Form"> 
    </form>  
    </div>
    </section>
</main>
