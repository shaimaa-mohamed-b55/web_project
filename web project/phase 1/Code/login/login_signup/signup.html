<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Flow</title>
</head>
<body>
<header><h1>Flow <br>Start your  flow journey</></h1>
    <img src="images/flow_logo.png" alt="Flow Logo" width="200">
    <section class="signup">
    <h3>Join Flow Community</h3>
    <!-- fieldset for signup -->
    <fieldset class="signup_fieldset">
        <legend>Personal Information</legend>
        <form action="" method="POST">
        <label for="first name">First Name:</label>
        <input type="text" id="first name" name="first name" required placeholder="first name">
        <label for="last name">Last Name:</label>
        <input type="text" id="last name" name="last name" required placeholder="last name">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required placeholder="username" minlength="5" maxlength="30">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="email">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="password" minlength="10" maxlength="20">
        <input type="submit" value="Start your Flow journey"> 
        </form>
    </fieldset>
    </section>
</body>
</html>
