<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow-scial media plattform</title>
    <link rel="stylesheet" href="login.css">
     </head>
<body>
   
<header>
    <img class="logo" src="images\flow_logo.png" alt="Flow Logo" width="200">
</header>
<!-- fieldset for user login -->
<section class="login">
    <fieldset class="login_fieldset">
        <legend>login to Flow</legend>
        <form action="" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required placeholder="username">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="password" minlength="10" maxlength="20" contains="upper case, lower case, number and special character" massege="password must contain upper case, lower case, number and special character">
            <input type="submit" value="Login"> 
            <h5>you don't have an account? <a href="signup.html">Sign up</a></h5>

        </form>
    </fieldset>
</section>
</body>
</html>
