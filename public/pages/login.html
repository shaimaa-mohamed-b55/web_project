<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow-social media plattform</title>
    <link rel="stylesheet" href="/public/style/main.css">
    <link rel="stylesheet" href="/public/style/auth.css">
</head>

<body>
<!-- ==========================
           HEADER 
=========================== -->
<header class="header">  
    <img class="logo" src="/public/media/images/flow_logo.png" alt="Flow Logo">

<!-- ==========================
           NAVIGATION 
=========================== -->
<nav class="nav">
<a href="/public/pages/login.html">Login</a>
<a href="/public/pages/signup.html">Signup</a>
</header>
</nav>
<!-- ==========================
             MAIN 
=========================== -->
<main>
<section class="login">
    <div class="login-div">
    <div>
        <legend>login to Flow</legend>
        <form  id="login-form" action="" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required placeholder="username">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="password" >
     <input type="submit" id="login-btn" value="Login">
     <small>you don't have an account? <a href="/public/pages/signup.html">Signup</a></small>

    </form>
   
    </div>
    </div>
</section>
</main>

<!-- ==========================
            FOOTER
     =========================== -->
<footer class="footer">
    <p>&copy; 2026 Flow. All rights reserved.</p>
    <a href="/public/pages/login.html">Login</a> 
    <a href="/public/pages/signup.html">Signup</a>
</footer>

<script src="/public/js/auth.js"></script>

</body>
</html>
